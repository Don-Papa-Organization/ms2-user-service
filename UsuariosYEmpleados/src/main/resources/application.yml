spring:
  application:
    name: UsuariosYEmpleados

  # ========== DATASOURCE (MySQL) ==========
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:don_papa}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:MiContraseñaSegura123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      connection-test-query: SELECT 1

  # ========== JPA ==========
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
        jdbc:
          batch_size: 20

  # ========== SERVER ==========
  server:
    port: ${PORT:8080}  # ¡IMPORTANTE! Render/Azure usan PORT

  # ========== ACTUATOR ==========
  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always
        probes:
          enabled: true

# ========== LOGGING ==========
logging:
  level:
    org.springframework.web: INFO
    com.zaxxer.hikari: DEBUG